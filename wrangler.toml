# Cavalaria — Cloudflare config
#
# Pages (the game itself): NO config needed. Deploy from the dashboard
# (Framework preset: None, build command empty, output directory /)
# or:  wrangler pages deploy . --project-name cavalaria
#
# There is no Worker for this game: multiplayer is peer-to-peer via
# PeerJS (free public broker), so nothing server-side needs deploying.
name = "cavalaria"
compatibility_date = "2026-11-01"
