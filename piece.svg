<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cavalaria piece: classic knight (horse head + arched neck) with a small pawn
       riding diagonally on the back of its neck. Single-colour silhouette (fill=currentColor) -->
  <g fill="currentColor">
    <!-- horse head + neck + pedestal base, facing left -->
    <path d="M24 94
      L76 94
      C76 88 74 83 69 80
      C66 62 62 46 48 32
      C42 26 36 26 30 30
      C24 34 18 38 14 44
      C11 48 12 52 17 53
      C22 55 26 54 28 50
      C32 58 35 68 37 80
      C32 83 27 88 24 94 Z"/>
    <!-- ears -->
    <path d="M31 29 L32 16 L39 25 Z"/>
    <path d="M39 26 L44 15 L48 26 Z"/>
    <!-- pawn rider: simple torso + ball head, leaning diagonally back off the
         mane curve so head + torso stand clear of the horse's silhouette -->
    <g transform="rotate(35 61 54)">
      <path d="M55 54 L67 54 L64 40 L58 40 Z"/>
      <circle cx="61" cy="35" r="6.5"/>
    </g>
  </g>
</svg>
