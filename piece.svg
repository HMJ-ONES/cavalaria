<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cavalaria piece: classic knight (long face, arched neck, pedestal base) with a
       pawn — ball head, flared collar, tapered body — riding diagonally on the back
       of its neck. Single-colour silhouette (fill=currentColor); the pawn stands
       clear of the horse with a small gap, so the square shows through between them -->
  <g fill="currentColor">
    <!-- pedestal base -->
    <rect x="18" y="82" width="64" height="11" rx="3"/>
    <!-- head + neck, facing left -->
    <path d="M20 82
      C22 74 25 66 27 59
      C24 57 18 56 14 52
      C11 49 11 44 15 40
      C20 35 25 31 31 27
      C34 25 37 24 40 24
      C53 26 65 36 70 50
      C74 61 75 72 73 82 Z"/>
    <!-- ear -->
    <path d="M30 27 L29 14 L38 24 Z"/>
    <!-- pawn rider: collar + tapered body + ball head, leaning diagonally off the mane -->
    <g transform="translate(76 52) rotate(22) scale(1.1)">
      <path d="M-4.5 -18 L4.5 -18 L5.5 0 L-5.5 0 Z"/>
      <path d="M-3 -24 L3 -24 L6.5 -18 L-6.5 -18 Z"/>
      <circle cx="0" cy="-31" r="7"/>
    </g>
  </g>
</svg>
